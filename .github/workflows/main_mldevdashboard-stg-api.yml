# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - mldevdashboard-stg-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore
        run: dotnet restore backend/MldevDashboard.sln

      - name: Build
        run: dotnet build backend/MldevDashboard.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test backend/MldevDashboard.sln --configuration Release --no-build

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 8.*

      - name: Generate database migration script
        run: |
          mkdir -p ./database
          dotnet ef migrations script --idempotent \
            --project backend/src/MldevDashboard.Infrastructure/MldevDashboard.Infrastructure.csproj \
            --startup-project backend/src/MldevDashboard.Api/MldevDashboard.Api.csproj \
            --context MldevDashboardDbContext \
            --output ./database/migrations.sql

      - name: Publish
        run: dotnet publish backend/src/MldevDashboard.Api/MldevDashboard.Api.csproj --configuration Release --output ./publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./publish

      - name: Upload database migration artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-migrations
          path: ./database/migrations.sql

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./publish

      - name: Download database migration artifact
        uses: actions/download-artifact@v4
        with:
          name: db-migrations
          path: ./database
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_267F7A8114874B98B51BA74C4B370671 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E587DB221B8B4E959AB9F79E0B5FA366 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4335591E99ED4A9596189A03AD1481C2 }}

      - name: Apply database migrations
        uses: azure/sql-action@v2.3
        with:
          connection-string: >-
            Server=tcp:${{ secrets.AZURE_SQL_SERVER }},1433;
            Initial Catalog=${{ secrets.AZURE_SQL_DATABASE }};
            Authentication=Active Directory Service Principal;
            User ID=${{ secrets.AZURE_SQL_CLIENT_ID }};
            Password=${{ secrets.AZURE_SQL_CLIENT_SECRET }};
            Encrypt=True;
            TrustServerCertificate=False;
            Connection Timeout=30;
          path: ./database/migrations.sql

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mldevdashboard-stg-api'
          slot-name: 'Production'
          package: "./publish"
